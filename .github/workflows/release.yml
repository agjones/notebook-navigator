name: Release Obsidian plugin

on:
  push:
    tags:
      - '*'

permissions: read-all

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned Node.js
        env:
          NODE_VERSION: '24.19.0'
          NODE_LINUX_X64_SHA256: '14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647'
        run: |
          archive="node-v${NODE_VERSION}-linux-x64.tar.xz"
          archive_path="${RUNNER_TEMP}/${archive}"
          install_path="${RUNNER_TEMP}/node"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive_path" "https://nodejs.org/dist/v${NODE_VERSION}/${archive}"
          echo "${NODE_LINUX_X64_SHA256}  ${archive_path}" | sha256sum --check --strict
          mkdir "$install_path"
          tar --extract --xz --file "$archive_path" --directory "$install_path" --strip-components=1
          echo "${install_path}/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain versions
        run: |
          test "$(node --version)" = 'v24.19.0'
          test "$(npm --version)" = '11.17.0'

      - name: Verify release metadata
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          test "$(node -p 'require("./package.json").version')" = "$tag"
          test "$(node -p 'require("./manifest.json").version')" = "$tag"

      - name: Verify release source
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$release_commit" origin/main
          test "$(git rev-parse HEAD)" = "$release_commit"

      - name: Install audited dependencies
        run: npm ci

      - name: Verify dependency integrity
        run: |
          npm audit signatures
          npm audit --audit-level=high

      - name: Build, lint, and test
        run: ./scripts/build.sh

      - name: Check generated files
        run: git diff --exit-code

      - name: Generate release notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          {
            printf '# Notebook Navigator (Hardened) %s\n\n' "$tag"
            printf 'Security-hardened personal fork with plugin ID `notebook-navigator-hardened`. '
            printf 'Verify the attached `SHA256SUMS` and GitHub attestations before installation. '
            printf 'See `docs/security-hardening.md` in the tagged source for the threat model and residual risks.\n\n'
            printf '## Upstream version notes\n\n'
            node scripts/mdReleaseNotes.js "$tag"
          } > release-notes.md

      - name: Generate release checksums
        run: sha256sum main.js manifest.json styles.css > SHA256SUMS

      - name: Upload isolated release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            main.js
            manifest.json
            styles.css
            release-notes.md
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download isolated release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-assets/main.js
            release-assets/manifest.json
            release-assets/styles.css
            release-assets/SHA256SUMS

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --notes-file release-assets/release-notes.md \
            release-assets/main.js release-assets/manifest.json release-assets/styles.css release-assets/SHA256SUMS
